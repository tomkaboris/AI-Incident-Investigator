<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AI Incident Investigator</title><link rel="stylesheet" href="/dashboard/assets/dashboard.css"><style>.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(99,102,241,.2),transparent 35%),var(--bg)}.auth-card{width:min(460px,100%);padding:34px;border:1px solid var(--border);border-radius:22px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.28)}.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}.auth-card h1{font-size:30px;margin:0 0 8px}.auth-form{display:grid;gap:16px}.auth-form label{display:grid;gap:7px;font-size:13px;font-weight:700}.auth-tabs{display:flex;gap:6px;padding:5px;background:var(--panel-2);border-radius:12px;margin-bottom:22px}.auth-tabs button{flex:1}.auth-error{min-height:22px;color:#fb7185;font-size:13px}.hidden{display:none!important}</style></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><span class="brand-mark">AI</span><div><strong>Incident Investigator</strong><div class="form-help">Secure team workspace</div></div></div><div class="auth-tabs"><button id="login-tab" class="primary">Sign in</button><button id="register-tab" class="secondary">Create workspace</button></div><form id="login-form" class="auth-form"><div><h1>Welcome back</h1><p class="page-subtitle">Sign in to your incident workspace.</p></div><label>Email<input class="input" name="email" type="email" required autocomplete="email"></label><label>Password<input class="input" name="password" type="password" required autocomplete="current-password"></label><div class="auth-error" id="login-error"></div><button class="primary" type="submit">Sign in</button></form><form id="register-form" class="auth-form hidden"><div><h1>Create workspace</h1><p class="page-subtitle">The first account becomes workspace owner.</p></div><label>Full name<input class="input" name="full_name" required minlength="2"></label><label>Work email<input class="input" name="email" type="email" required></label><label>Organization name<input class="input" name="organization_name" required minlength="2"></label><label>Password<input class="input" name="password" type="password" required minlength="10"><span class="form-help">At least 10 characters.</span></label><div class="auth-error" id="register-error"></div><button class="primary" type="submit">Create account</button></form></section></main><script src="/dashboard/assets/auth.js"></script></body></html>
