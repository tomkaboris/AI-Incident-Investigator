name: Create Release and Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Get latest version tag
        id: latest
        shell: bash
        run: |
          latest_tag=$(git tag \
            --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-v:refname \
            | head -n 1)

          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          echo "Latest tag: $latest_tag"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          current="${{ steps.latest.outputs.tag }}"
          current="${current#v}"

          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump type: ${{ inputs.bump }}"
              exit 1
              ;;
          esac

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          echo "Version: $version"
          echo "Tag: $tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check that tag does not already exist
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Error: tag $tag already exists."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  build:
    name: Build Python package
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Show built files
        run: ls -lah dist/

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify built package version
        shell: bash
        run: |
          package_version=$(python -c \
            "from importlib.metadata import version; print(version('ai-incident-investigator'))")

          expected_version="${{ needs.release.outputs.version }}"

          echo "Built package version: $package_version"
          echo "Expected version:      $expected_version"

          if [ "$package_version" != "$expected_version" ]; then
            echo "Error: built package version does not match release version."
            exit 1
          fi

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ needs.release.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package to PyPI
    needs:
      - release
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/ai-incident-investigator

    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.release.outputs.version }}
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1