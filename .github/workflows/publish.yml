name: Publish to PyPI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git tag or ref to build and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check --strict dist/*

      - name: Show built files
        run: ls -lah dist/

      - name: Verify package version
        shell: bash
        run: |
          python -m pip install dist/*.whl

          PACKAGE_VERSION=$(python -c \
            "from importlib.metadata import version; print(version('ai-incident-investigator'))")

          EXPECTED_VERSION="${{ inputs.ref }}"
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"

          echo "Package version:  $PACKAGE_VERSION"
          echo "Expected version: $EXPECTED_VERSION"

          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Package version does not match release tag."
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ inputs.ref }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/ai-incident-investigator

    permissions:
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ inputs.ref }}
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1