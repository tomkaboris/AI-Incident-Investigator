[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-investigator"
dynamic = ["version"]
description = "Provider-neutral AI-powered incident classification, root-cause analysis, and reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Boris Tomka" }]
keywords = ["ai", "incident-analysis", "log-analysis", "root-cause-analysis", "fastapi", "observability", "incident-response"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "fastapi[standard]>=0.115",
    "openai-agents>=0.2",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
postgresql = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2"]
litellm = ["openai-agents[litellm]>=0.2"]
s3 = ["boto3>=1.35"]
all = [
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "openai-agents[litellm]>=0.2",
    "boto3>=1.35",
]
dev = [
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "openai-agents[litellm]>=0.2",
    "boto3>=1.35",
    "alembic>=1.14",
    "build",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "twine",
]

[project.scripts]
incident-investigator = "incident_investigator.cli:main"

[project.urls]
Homepage = "https://github.com/tomkaboris/AI-Incident-Investigator"
Repository = "https://github.com/tomkaboris/AI-Incident-Investigator"
Issues = "https://github.com/tomkaboris/AI-Incident-Investigator/issues"

[tool.setuptools.dynamic]
version = { attr = "incident_investigator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_investigator = ["py.typed", "dashboard/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
